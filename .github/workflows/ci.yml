name: LUCY Cross-Platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: LUCY-Windows
            pkg_pattern: dist/LUCY-Windows*
          - os: ubuntu-latest
            artifact_name: LUCY-Linux
            pkg_pattern: dist/LUCY-Linux*
          - os: macos-latest
            artifact_name: LUCY-macOS
            pkg_pattern: dist/LUCY-macOS*

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpulse0 \
            libasound2-dev \
            libgl1-mesa-glx \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            xvfb

      - name: Upgrade pip & install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static compile / syntax verification
        run: |
          python -m py_compile main.py ui.py build_dist.py setup.py core/platform_adapter.py

      - name: Run test suite
        run: |
          python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Headless startup smoke test
        run: |
          python -c "from core.personality import DEFAULT_PERSONALITY; assert DEFAULT_PERSONALITY == 'GF'; from core.animated_shapes import available_shapes; assert 'star' in available_shapes(); assert 'flower' in available_shapes(); assert 'human' in available_shapes(); print('SMOKE_TEST_PASSED')"

      - name: Build platform package
        run: |
          python build_dist.py

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.pkg_pattern }}
            dist/SHA256SUMS.txt
          if-no-files-found: error
